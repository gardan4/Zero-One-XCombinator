# Instruction-tuned fab model: prompt/completion SFT so the model is *promptable* for each graded
# task (next-step, completion, anomaly) + optional step reasoning. trl applies completion-only loss
# (text_field is null → prompt/completion dataset; extra.completion_only_loss=true).
# Start from the base instruct model (already instruction-capable); teach it the fab tasks.
name: leonardo-sft-fab-instruct-all
kind: sft
model: $SCRATCH/hf-local/Qwen2.5-1.5B-Instruct
dataset: data/generated/instruct_all.jsonl
text_field: ""            # empty -> prompt/completion path (completion-only loss)
lora: false
bf16: true
max_seq_len: 1024
learning_rate: 1.0e-5
warmup_ratio: 0.05
epochs: 3
batch_size: 4
grad_accum: 4
seed: 42
extra:
  local_files_only: true
  gradient_checkpointing: true
  completion_only_loss: true
  push_to_hub: false
  base_model_hub_id: Qwen/Qwen2.5-1.5B-Instruct
  tags: [leonardo, sft, fab, instruct, full-ft, all-families, "stream:1"]
