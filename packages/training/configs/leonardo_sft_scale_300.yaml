# Data-scaling study: SFT-all on 300 sequences/family (subsampled). Identical to
# leonardo_sft_fab.yaml except the dataset size — vary ONLY the data to plot accuracy vs #seqs.
name: leonardo-sft-scale-300
kind: sft
model: /leonardo_scratch/large/usertrain/a08trd0f/hf-local/Qwen2.5-1.5B-Instruct
dataset: data/generated_scale/300/MOSFET_sft_lm.jsonl,data/generated_scale/300/IGBT_sft_lm.jsonl,data/generated_scale/300/IC_sft_lm.jsonl
text_field: text
lora: false
bf16: true
max_seq_len: 1024
learning_rate: 1.0e-5
warmup_ratio: 0.05
epochs: 2
batch_size: 4
grad_accum: 4
seed: 42
extra:
  local_files_only: true
  gradient_checkpointing: true
  push_to_hub: false
  base_model_hub_id: Qwen/Qwen2.5-1.5B-Instruct
  tags: [leonardo, sft, fab, scale, "data-size:300", all-families]
