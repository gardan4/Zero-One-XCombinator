# GRPO cross-product — OUTCOME reward × NEXT-STEP task × all families.
#
# ⚠️ KNOWN-DEGENERATE ARM — do NOT run as-is (kept as the documented negative result). A next-step
# answer is ~1 step, which trips the reward's anti-hack `< MIN_STEPS` floor: every sample in a group
# scores the same -0.99, so the GRPO advantage (group std) is zero and nothing learns. This is the
# no-op run we already observed (reward ~ -0.99, frac_reward_zero_std ~ 1.0). Even prefix-aware the
# length guard fires on the *completion* length, so the floor stands. Next-step needs a *boundary*
# reward ("is the appended step legal after the prefix?") — a separate optional arm. Prefer the
# completion configs (grpo_fab_{out,proc}_completion_all.yaml), where the reward has real signal.
# Starts FROM the instruction-tuned SFT checkpoint (set ZO_SFT_CHECKPOINT_DIR in .env).
name: grpo-out-nextstep-all
kind: grpo
model: ${ZO_SFT_CHECKPOINT_DIR}
dataset: data/generated/MOSFET_eval_nextstep.jsonl,data/generated/IGBT_eval_nextstep.jsonl,data/generated/IC_eval_nextstep.jsonl
learning_rate: 1.0e-6
batch_size: 8
grad_accum: 1
epochs: 1
max_seq_len: 1024
lora: true
bf16: true
extra:
  num_generations: 8
  max_completion_length: 64    # next-step: short continuations
  reward: validate             # OUTCOME: 1 - n_violations/n_steps
  local_files_only: true
  # max_steps: 50              # GPU smoke gate before the full run
  tags: [debug, leonardo, grpo, rlvr, "reward:output", "task:nextstep", all-families, "stream:2"]
