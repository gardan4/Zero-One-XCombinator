# GRPO cross-product — PROCESS reward × NEXT-STEP task × all families.
#
# ⚠️ KNOWN-DEGENERATE ARM — do NOT run as-is (see grpo_fab_out_nextstep_all.yaml for the full why).
# A ~1-step next-step answer trips the reward's `< MIN_STEPS` floor → identical -0.99 across the group
# → zero GRPO advantage → no learning. The length guard is on the *completion* length, so prefix-
# awareness doesn't lift it. Next-step needs a *boundary* reward, a separate optional arm. Prefer the
# completion configs. Kept as the documented negative result.
# Starts FROM the instruction-tuned SFT checkpoint (set ZO_SFT_CHECKPOINT_DIR in .env).
name: grpo-proc-nextstep-all
kind: grpo
model: ${ZO_SFT_CHECKPOINT_DIR}
dataset: data/generated/MOSFET_eval_nextstep.jsonl,data/generated/IGBT_eval_nextstep.jsonl,data/generated/IC_eval_nextstep.jsonl
learning_rate: 1.0e-6
batch_size: 8
grad_accum: 1
epochs: 1
max_seq_len: 1024
lora: true
bf16: true
extra:
  num_generations: 8
  max_completion_length: 64
  reward: process              # PROCESS: longest_valid_prefix / n_steps
  local_files_only: true
  # max_steps: 50
  tags: [debug, leonardo, grpo, rlvr, "reward:process", "task:nextstep", all-families, "stream:2"]
