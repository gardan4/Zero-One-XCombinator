# Stream 1 — LOFO (leave-one-family-out) OOD model: MOSFET held out.
# Trains ONLY on IC + IGBT; MOSFET is the unseen family the eval tests against.
# This is an honest OOD probe (the hidden 4th family can't be rehearsed locally, so LOFO
# over the 3 real families is our only OOD proxy). Pairs with splits.json lofo.MOSFET
# (train_families: [IC, IGBT]).
#
# Validate:  just train configs/sft_fab_lofo_mosfet.yaml --dry-run
# Real (GPU): uv run zo-train sft -c configs/sft_fab_lofo_mosfet.yaml
name: sft-fab-lofo-mosfet
kind: sft
model: Qwen/Qwen2.5-1.5B-Instruct
dataset: data/generated/IC_sft_lm.jsonl,data/generated/IGBT_sft_lm.jsonl
text_field: text
lora: false
epochs: 3
batch_size: 8
grad_accum: 2
learning_rate: 2.0e-5
max_seq_len: 1024
warmup_ratio: 0.03
bf16: true
seed: 42
extra:
  tags: [stream:1, lofo:mosfet, split:ood]
  held_out_family: MOSFET
  max_steps: 50
