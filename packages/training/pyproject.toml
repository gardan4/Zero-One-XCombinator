[project]
name = "zo-train"
version = "0.1.0"
description = "SFT + GRPO/RL recipes and SLURM cluster submission for Zero One."
requires-python = ">=3.11"
dependencies = [
    "zo-common",
    "typer>=0.12",
    "pyyaml>=6",
    "rich>=13",
    "jinja2>=3",
]

# Heavy ML stack — installs on the cluster via `uv sync --extra gpu`, NOT on laptops.
[project.optional-dependencies]
gpu = [
    "torch>=2.5,<2.8",
    "transformers>=4.44,<5",
    "trl>=0.12,<1",
    "peft>=0.12",
    "accelerate>=0.34",
    "datasets>=2.20",
    "wandb>=0.17",
]

[project.scripts]
zo-train = "zo_train.cli:app"
zo-cluster = "zo_train.cluster.submit:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zo_train"]

[tool.uv.sources]
zo-common = { workspace = true }
