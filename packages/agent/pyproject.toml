[project]
name = "zo-agent"
version = "0.1.0"
description = "Agent rollout harness for Zero One — tools, scenarios, task-success scoring."
requires-python = ">=3.11"
dependencies = [
    "zo-common",
    "typer>=0.12",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
zo-agent = "zo_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zo_agent"]

[tool.uv.sources]
zo-common = { workspace = true }
