[project]
name = "zo-eval"
version = "0.1.0"
description = "Model eval harness for Zero One — tasks in, metrics into the run registry."
requires-python = ">=3.11"
dependencies = [
    "zo-common",
    "zo-train",  # grammar/fab/datagen: the verifier, vocab, splits, and the data corpus
    "typer>=0.12",
    "pyyaml>=6",
    "rich>=13",
]

# Optional: load HF datasets / run local (non-API) eval.
[project.optional-dependencies]
gpu = ["datasets>=2.20", "transformers>=4.44"]

[project.scripts]
zo-eval = "zo_eval.cli:app"
zo-track = "zo_eval.track_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zo_eval"]

[tool.uv.sources]
zo-common = { workspace = true }
zo-train = { workspace = true }
