[project]
name = "zo-backend"
version = "0.1.0"
description = "FastAPI control plane — serves the run registry to the dashboard."
requires-python = ">=3.11"
dependencies = [
    "zo-common",
    "zo-eval",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zo_backend"]

[tool.uv.sources]
zo-common = { workspace = true }
zo-eval = { workspace = true }
